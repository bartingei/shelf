# Shelf — nginx reverse proxy in front of `next start` on 127.0.0.1:3000.
# Install to /etc/nginx/sites-available/shelf (deploy/setup-ec2.sh does this).

server {
    listen 80;
    listen [::]:80;

    # Replace with your domain once you have one; "_" matches any host, which
    # is what you want while you're still reaching the box by its public IP.
    server_name _;

    # Shelf accepts PDFs up to 100MB (MAX_UPLOAD_BYTES in src/lib/constants.ts).
    # nginx's default cap is 1MB, which would reject every real upload with a
    # 413 before the request ever reaches Next.js.
    client_max_body_size 110M;
    client_body_timeout 300s;

    # Uploads buffer through this proxy on their way to Supabase Storage; the
    # upload route allows itself 60s, so give the proxy comfortable headroom
    # rather than cutting a large PDF off mid-transfer with a 504.
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;

        # Upgrade headers keep Next.js's dev-style websocket/HMR and any
        # streaming responses working through the proxy.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_cache_bypass $http_upgrade;
    }
}
